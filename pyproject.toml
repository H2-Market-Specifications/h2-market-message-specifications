[project]
name = "h2-market-message-specifications"
version = "0.1.0"
description = "H2 market message schemas and semantic validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools.validation*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
