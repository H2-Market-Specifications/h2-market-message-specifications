# Map message examples/test payloads to their JSON Schema.
# Invalid examples are expected to fail validation.

validations:

### MEASUREMENT MESSAGES
  - schema: schemas/messages/measurement/v0.9/preliminary/preliminary-measurement-message.schema.json
    valid:
      - examples/messages/measurement/v0.9/preliminary/*.valid.json
    invalid:
      - examples/messages/measurement/v0.9/preliminary/invalid/*.json
  - schema: schemas/messages/measurement/v0.9/final/final-measurement-message.schema.json
