name: Validate JSON and Schemas

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-standards:
    name: Repository standards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install validation package and dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate JSON syntax, JSON Schemas, refs, and declared schemas
        run: python tools/validate_json_schemas.py --root . --manifest validation/validation-manifest.yml --standards-only

  message-examples:
    name: Message examples
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install validation package and dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run semantic validation tests
        run: python -m pytest tests

      - name: Validate positive and negative examples against message schemas
        run: python tools/validate_json_schemas.py --root . --manifest validation/validation-manifest.yml --examples-only --require-manifest
